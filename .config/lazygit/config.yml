gui:
  switchTabsWithPanelJumpKeys: true
git:
  autoForwardBranches: none
  autoFetch: false
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  ignoreWhitespaceInDiffView: true
